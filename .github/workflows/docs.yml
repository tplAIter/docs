name: docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2: immutable commit verified from the official actions/checkout ref.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v2.2.0: immutable commit verified from the official oven-sh/setup-bun ref.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run check
