name: docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2: immutable commit verified from the official actions/checkout ref.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v4.4.0: immutable commit verified from the official actions/setup-node ref.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.5
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run build
